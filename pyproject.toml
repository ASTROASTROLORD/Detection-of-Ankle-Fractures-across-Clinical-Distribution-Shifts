[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankle-fracture-algorithm"
version = "0.2.0"
description = "Multicenter Evaluation of Patient-Level Recognition and Lesion-Level Detection of Ankle Fractures across Clinical Scenarios"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["algorithm*", "interface*"]

[tool.setuptools.package-data]
algorithm = ["schemas/*.json", "schemas/*.yaml"]
